name: macOS Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      run_tests:
        description: '运行核心单元与回归测试（会编译测试目标）'
        type: boolean
        default: false
      run_build:
        description: '编译 Universal Release App 与嵌入目标'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Static checks and deterministic project
        run: |
          set -euo pipefail
          python3 Scripts/generate_xcode_project.py
          git diff --exit-code -- CodexUsager.xcodeproj/project.pbxproj
          python3 Scripts/check_static.py
      - name: Select Xcode for requested validation
        if: github.event_name == 'workflow_dispatch' && (inputs.run_tests || inputs.run_build)
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: '26.6'
      - name: Unit and regression tests
        if: github.event_name == 'workflow_dispatch' && inputs.run_tests
        run: swift test
      - name: Compile universal App and embedded targets
        if: github.event_name == 'workflow_dispatch' && inputs.run_build
        run: |
          set -euo pipefail
          xcodebuild -project CodexUsager.xcodeproj -scheme CodexUsager \
            -configuration Release -destination 'generic/platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/CodexUsagerChecks" \
            ARCHS='arm64 x86_64' ONLY_ACTIVE_ARCH=NO CODE_SIGNING_ALLOWED=NO build
          python3 Scripts/validate_release.py --mode unsigned-preview \
            --app "$RUNNER_TEMP/CodexUsagerChecks/Build/Products/Release/CodexUsager.app"
